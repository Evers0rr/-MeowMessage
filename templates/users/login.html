{% extends "base/basic.html" %}
{% load crispy_forms_tags %}

{% block title %}Вхід | ClearTask{% endblock %}

{% block content %}
  <div class="card shadow-sm">
    <div class="card-body">
      <h2 class="mb-4">🔐 Вхід</h2>
      <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" class="btn btn-primary">Увійти</button>
        <a href="{% url 'register' %}" class="btn btn-link">Немає акаунту? Зареєструватися</a>
      </form>
    </div>
  </div>
{% endblock %}
